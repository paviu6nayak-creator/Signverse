<svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Card Background -->
  <rect width="200" height="160" rx="16" fill="#0f172a" />
  
  <defs>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#06b6d4" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#0f172a" stopOpacity="0.95" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Large Center Watermark Letter/Digit -->
  <text x="100" y="94" fill="#06b6d4" opacity="0.08" fontSize="84" fontWeight="900" textAnchor="middle" fontFamily="system-ui, sans-serif">
    L
  </text>

  <!-- Handshape Vector Diagram -->
  <g filter="url(#softGlow)">
    
            <!-- Palm / Fist -->
            <rect x="78" y="70" width="50" height="56" rx="16" fill="url(#handGrad)" />
            <!-- Index pointing straight UP (Vertical stem of L) -->
            <rect x="76" y="18" width="15" height="68" rx="7.5" fill="#cffafe" stroke="#0891b2" stroke-width="2" />
            <!-- Thumb extended horizontally to the left (Horizontal base of L) -->
            <rect x="30" y="82" width="56" height="15" rx="7.5" fill="#e0f2fe" stroke="#0891b2" stroke-width="2" />
            <!-- Curled 3 fingers -->
            <circle cx="106" cy="78" r="8" fill="#0e7490" />
            <circle cx="106" cy="94" r="8" fill="#155e75" />
            <circle cx="106" cy="110" r="7" fill="#164e63" />
            <!-- Wrist -->
            <rect x="84" y="126" width="34" height="24" rx="6" fill="#164e63" />
        
  </g>

  <!-- Top Left Identification Badge -->
  <rect x="12" y="12" width="32" height="24" rx="8" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1.5" />
  <text x="28" y="29" fill="#06b6d4" fontSize="13" fontWeight="bold" textAnchor="middle" fontFamily="system-ui, sans-serif">
    L
  </text>

  <!-- Bottom Instruction Pill -->
  <rect x="14" y="130" width="172" height="22" rx="11" fill="#1e293b" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="1" />
  <text x="100" y="145" fill="#06b6d4" fontSize="10.5" fontWeight="600" textAnchor="middle" fontFamily="system-ui, sans-serif">
    Letter L · ASL Sign
  </text>
</svg>
