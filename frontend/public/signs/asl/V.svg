<svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Card Background -->
  <rect width="200" height="160" rx="16" fill="#0f172a" />
  
  <defs>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#14b8a6" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#0f172a" stopOpacity="0.95" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Large Center Watermark Letter/Digit -->
  <text x="100" y="94" fill="#14b8a6" opacity="0.08" fontSize="84" fontWeight="900" textAnchor="middle" fontFamily="system-ui, sans-serif">
    V
  </text>

  <!-- Handshape Vector Diagram -->
  <g filter="url(#softGlow)">
    
            <!-- Fist Base -->
            <rect x="72" y="76" width="56" height="50" rx="16" fill="url(#handGrad)" />
            <!-- Index finger angled left -->
            <rect x="76" y="20" width="13" height="64" rx="6.5" fill="#99f6e4" stroke="#0f766e" stroke-width="2" transform="rotate(-15 82 52)" />
            <!-- Middle finger angled right -->
            <rect x="98" y="20" width="13" height="64" rx="6.5" fill="#ccfbf1" stroke="#0f766e" stroke-width="2" transform="rotate(15 104 52)" />
            <!-- Thumb folded across ring and pinky -->
            <rect x="70" y="90" width="42" height="16" rx="8" fill="#5eead4" stroke="#115e59" stroke-width="1.5" />
            <!-- Wrist -->
            <rect x="82" y="126" width="36" height="24" rx="6" fill="#134e4a" />
        
  </g>

  <!-- Top Left Identification Badge -->
  <rect x="12" y="12" width="32" height="24" rx="8" fill="#14b8a6" fill-opacity="0.15" stroke="#14b8a6" stroke-width="1.5" />
  <text x="28" y="29" fill="#14b8a6" fontSize="13" fontWeight="bold" textAnchor="middle" fontFamily="system-ui, sans-serif">
    V
  </text>

  <!-- Bottom Instruction Pill -->
  <rect x="14" y="130" width="172" height="22" rx="11" fill="#1e293b" stroke="#14b8a6" stroke-opacity="0.2" stroke-width="1" />
  <text x="100" y="145" fill="#14b8a6" fontSize="10.5" fontWeight="600" textAnchor="middle" fontFamily="system-ui, sans-serif">
    Letter V · ASL Sign
  </text>
</svg>
