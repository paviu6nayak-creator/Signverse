<svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Card Background -->
  <rect width="200" height="160" rx="16" fill="#0f172a" />
  
  <defs>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#10b981" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#0f172a" stopOpacity="0.95" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Large Center Watermark Letter/Digit -->
  <text x="100" y="94" fill="#10b981" opacity="0.08" fontSize="84" fontWeight="900" textAnchor="middle" fontFamily="system-ui, sans-serif">
    Q
  </text>

  <!-- Handshape Vector Diagram -->
  <g filter="url(#softGlow)">
    
            <!-- Fist Base above -->
            <rect x="70" y="44" width="60" height="50" rx="16" fill="url(#handGrad)" />
            <!-- Index finger pointing straight down -->
            <rect x="78" y="84" width="14" height="54" rx="7" fill="#a7f3d0" stroke="#059669" stroke-width="2" />
            <!-- Thumb pointing down parallel to index -->
            <rect x="98" y="84" width="14" height="48" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="2" />
            <!-- Wrist coming from above -->
            <rect x="82" y="18" width="36" height="28" rx="6" fill="#064e3b" />
        
  </g>

  <!-- Top Left Identification Badge -->
  <rect x="12" y="12" width="32" height="24" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" />
  <text x="28" y="29" fill="#10b981" fontSize="13" fontWeight="bold" textAnchor="middle" fontFamily="system-ui, sans-serif">
    Q
  </text>

  <!-- Bottom Instruction Pill -->
  <rect x="14" y="130" width="172" height="22" rx="11" fill="#1e293b" stroke="#10b981" stroke-opacity="0.2" stroke-width="1" />
  <text x="100" y="145" fill="#10b981" fontSize="10.5" fontWeight="600" textAnchor="middle" fontFamily="system-ui, sans-serif">
    Letter Q · ASL Sign
  </text>
</svg>
