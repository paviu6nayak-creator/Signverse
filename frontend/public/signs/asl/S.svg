<svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Card Background -->
  <rect width="200" height="160" rx="16" fill="#0f172a" />
  
  <defs>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#eab308" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#0f172a" stopOpacity="0.95" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Large Center Watermark Letter/Digit -->
  <text x="100" y="94" fill="#eab308" opacity="0.08" fontSize="84" fontWeight="900" textAnchor="middle" fontFamily="system-ui, sans-serif">
    S
  </text>

  <!-- Handshape Vector Diagram -->
  <g filter="url(#softGlow)">
    
            <!-- Fist Base -->
            <rect x="68" y="65" width="64" height="60" rx="20" fill="url(#handGrad)" />
            <!-- 4 Curled finger fronts -->
            <rect x="72" y="66" width="56" height="12" rx="6" fill="#fef08a" />
            <rect x="72" y="80" width="56" height="12" rx="6" fill="#fde047" />
            <rect x="74" y="94" width="54" height="12" rx="6" fill="#eab308" />
            <rect x="76" y="108" width="50" height="10" rx="5" fill="#ca8a04" />
            <!-- Thumb wrapped horizontally ACROSS front of fist -->
            <rect x="64" y="80" width="62" height="18" rx="9" fill="#fef9c3" stroke="#a16207" stroke-width="2.5" />
            <!-- Wrist -->
            <rect x="80" y="125" width="40" height="25" rx="6" fill="#713f12" />
        
  </g>

  <!-- Top Left Identification Badge -->
  <rect x="12" y="12" width="32" height="24" rx="8" fill="#eab308" fill-opacity="0.15" stroke="#eab308" stroke-width="1.5" />
  <text x="28" y="29" fill="#eab308" fontSize="13" fontWeight="bold" textAnchor="middle" fontFamily="system-ui, sans-serif">
    S
  </text>

  <!-- Bottom Instruction Pill -->
  <rect x="14" y="130" width="172" height="22" rx="11" fill="#1e293b" stroke="#eab308" stroke-opacity="0.2" stroke-width="1" />
  <text x="100" y="145" fill="#eab308" fontSize="10.5" fontWeight="600" textAnchor="middle" fontFamily="system-ui, sans-serif">
    Letter S · ASL Sign
  </text>
</svg>
