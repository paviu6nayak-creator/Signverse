<svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Card Background -->
  <rect width="200" height="160" rx="16" fill="#0f172a" />
  
  <defs>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fb923c" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#0f172a" stopOpacity="0.95" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Large Center Watermark Letter/Digit -->
  <text x="100" y="94" fill="#fb923c" opacity="0.08" fontSize="84" fontWeight="900" textAnchor="middle" fontFamily="system-ui, sans-serif">
    J
  </text>

  <!-- Handshape Vector Diagram -->
  <g filter="url(#softGlow)">
    
            <!-- Fist Base -->
            <rect x="70" y="68" width="60" height="58" rx="18" fill="url(#handGrad)" />
            <!-- Pinky finger -->
            <rect x="118" y="28" width="13" height="54" rx="6.5" fill="#fed7aa" stroke="#ea580c" stroke-width="2" />
            <!-- J-shaped swooping motion arrow -->
            <path d="M 124 86 C 124 116, 96 126, 76 112" stroke="#f97316" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-dasharray="4 3" />
            <polygon points="70,110 82,106 80,118" fill="#f97316" />
            <!-- Thumb folded across fingers -->
            <rect x="68" y="80" width="44" height="16" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" />
            <!-- Wrist -->
            <rect x="82" y="126" width="36" height="24" rx="6" fill="#431407" />
        
  </g>

  <!-- Top Left Identification Badge -->
  <rect x="12" y="12" width="32" height="24" rx="8" fill="#fb923c" fill-opacity="0.15" stroke="#fb923c" stroke-width="1.5" />
  <text x="28" y="29" fill="#fb923c" fontSize="13" fontWeight="bold" textAnchor="middle" fontFamily="system-ui, sans-serif">
    J
  </text>

  <!-- Bottom Instruction Pill -->
  <rect x="14" y="130" width="172" height="22" rx="11" fill="#1e293b" stroke="#fb923c" stroke-opacity="0.2" stroke-width="1" />
  <text x="100" y="145" fill="#fb923c" fontSize="10.5" fontWeight="600" textAnchor="middle" fontFamily="system-ui, sans-serif">
    Letter J · ASL Sign
  </text>
</svg>
