<svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Card Background -->
  <rect width="200" height="160" rx="16" fill="#0f172a" />
  
  <defs>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4ade80" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#0f172a" stopOpacity="0.95" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Large Center Watermark Letter/Digit -->
  <text x="100" y="94" fill="#4ade80" opacity="0.08" fontSize="84" fontWeight="900" textAnchor="middle" fontFamily="system-ui, sans-serif">
    K
  </text>

  <!-- Handshape Vector Diagram -->
  <g filter="url(#softGlow)">
    
            <!-- Fist Base -->
            <rect x="72" y="76" width="56" height="50" rx="16" fill="url(#handGrad)" />
            <!-- Index finger straight UP -->
            <rect x="76" y="20" width="13" height="62" rx="6.5" fill="#bbf7d0" stroke="#16a34a" stroke-width="2" />
            <!-- Middle finger angled forward-right -->
            <rect x="94" y="26" width="13" height="60" rx="6.5" fill="#dcfce7" stroke="#16a34a" stroke-width="2" transform="rotate(22 94 60)" />
            <!-- Thumb upright between the two fingers -->
            <rect x="85" y="52" width="13" height="38" rx="6.5" fill="#f0fdf4" stroke="#15803d" stroke-width="2" />
            <!-- Wrist -->
            <rect x="82" y="126" width="36" height="24" rx="6" fill="#14532d" />
        
  </g>

  <!-- Top Left Identification Badge -->
  <rect x="12" y="12" width="32" height="24" rx="8" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1.5" />
  <text x="28" y="29" fill="#4ade80" fontSize="13" fontWeight="bold" textAnchor="middle" fontFamily="system-ui, sans-serif">
    K
  </text>

  <!-- Bottom Instruction Pill -->
  <rect x="14" y="130" width="172" height="22" rx="11" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.2" stroke-width="1" />
  <text x="100" y="145" fill="#4ade80" fontSize="10.5" fontWeight="600" textAnchor="middle" fontFamily="system-ui, sans-serif">
    Letter K · ASL Sign
  </text>
</svg>
