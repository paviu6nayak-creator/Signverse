<svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Card Background -->
  <rect width="200" height="160" rx="16" fill="#0f172a" />
  
  <defs>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8b5cf6" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#0f172a" stopOpacity="0.95" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Large Center Watermark Letter/Digit -->
  <text x="100" y="94" fill="#8b5cf6" opacity="0.08" fontSize="84" fontWeight="900" textAnchor="middle" fontFamily="system-ui, sans-serif">
    R
  </text>

  <!-- Handshape Vector Diagram -->
  <g filter="url(#softGlow)">
    
            <!-- Fist Base -->
            <rect x="72" y="76" width="56" height="50" rx="16" fill="url(#handGrad)" />
            <!-- Index Finger -->
            <rect x="80" y="22" width="13" height="64" rx="6.5" fill="#c4b5fd" stroke="#7c3aed" stroke-width="2" transform="rotate(8 86 54)" />
            <!-- Middle Finger crossed over front of index -->
            <rect x="90" y="20" width="13" height="66" rx="6.5" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" transform="rotate(-12 96 53)" />
            <!-- Thumb folded across ring and pinky -->
            <rect x="70" y="90" width="44" height="16" rx="8" fill="#ddd6fe" stroke="#6d28d9" stroke-width="1.5" />
            <!-- Wrist -->
            <rect x="82" y="126" width="36" height="24" rx="6" fill="#3b0764" />
        
  </g>

  <!-- Top Left Identification Badge -->
  <rect x="12" y="12" width="32" height="24" rx="8" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1.5" />
  <text x="28" y="29" fill="#8b5cf6" fontSize="13" fontWeight="bold" textAnchor="middle" fontFamily="system-ui, sans-serif">
    R
  </text>

  <!-- Bottom Instruction Pill -->
  <rect x="14" y="130" width="172" height="22" rx="11" fill="#1e293b" stroke="#8b5cf6" stroke-opacity="0.2" stroke-width="1" />
  <text x="100" y="145" fill="#8b5cf6" fontSize="10.5" fontWeight="600" textAnchor="middle" fontFamily="system-ui, sans-serif">
    Letter R · ASL Sign
  </text>
</svg>
