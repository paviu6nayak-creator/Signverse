<svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Card Background -->
  <rect width="200" height="160" rx="16" fill="#0f172a" />
  
  <defs>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#0f172a" stopOpacity="0.95" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Large Center Watermark Letter/Digit -->
  <text x="100" y="94" fill="#38bdf8" opacity="0.08" fontSize="84" fontWeight="900" textAnchor="middle" fontFamily="system-ui, sans-serif">
    H
  </text>

  <!-- Handshape Vector Diagram -->
  <g filter="url(#softGlow)">
    
            <!-- Fist Base -->
            <rect x="75" y="66" width="50" height="54" rx="16" fill="url(#handGrad)" />
            <!-- Index finger horizontal -->
            <rect x="22" y="64" width="68" height="13" rx="6.5" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
            <!-- Middle finger horizontal right below index -->
            <rect x="22" y="79" width="68" height="13" rx="6.5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
            <!-- Thumb tucked across ring finger -->
            <rect x="70" y="93" width="30" height="13" rx="6.5" fill="#7dd3fc" />
            <!-- Wrist -->
            <rect x="114" y="78" width="26" height="34" rx="6" fill="#0c4a6e" />
        
  </g>

  <!-- Top Left Identification Badge -->
  <rect x="12" y="12" width="32" height="24" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5" />
  <text x="28" y="29" fill="#38bdf8" fontSize="13" fontWeight="bold" textAnchor="middle" fontFamily="system-ui, sans-serif">
    H
  </text>

  <!-- Bottom Instruction Pill -->
  <rect x="14" y="130" width="172" height="22" rx="11" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
  <text x="100" y="145" fill="#38bdf8" fontSize="10.5" fontWeight="600" textAnchor="middle" fontFamily="system-ui, sans-serif">
    Letter H · ASL Sign
  </text>
</svg>
