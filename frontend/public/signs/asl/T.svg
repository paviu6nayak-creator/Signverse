<svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Card Background -->
  <rect width="200" height="160" rx="16" fill="#0f172a" />
  
  <defs>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0ea5e9" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#0f172a" stopOpacity="0.95" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Large Center Watermark Letter/Digit -->
  <text x="100" y="94" fill="#0ea5e9" opacity="0.08" fontSize="84" fontWeight="900" textAnchor="middle" fontFamily="system-ui, sans-serif">
    T
  </text>

  <!-- Handshape Vector Diagram -->
  <g filter="url(#softGlow)">
    
            <!-- Fist Base -->
            <rect x="68" y="65" width="64" height="60" rx="20" fill="url(#handGrad)" />
            <!-- Index finger curled over thumb -->
            <rect x="72" y="64" width="22" height="44" rx="11" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
            <!-- Thumb protruding up between index and middle knuckles -->
            <ellipse cx="94" cy="68" rx="8" ry="12" fill="#f0f9ff" stroke="#0369a1" stroke-width="2" />
            <!-- Middle, ring, pinky fingers curled -->
            <rect x="94" y="74" width="34" height="34" rx="10" fill="#38bdf8" />
            <!-- Wrist -->
            <rect x="80" y="125" width="40" height="25" rx="6" fill="#082f49" />
        
  </g>

  <!-- Top Left Identification Badge -->
  <rect x="12" y="12" width="32" height="24" rx="8" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-width="1.5" />
  <text x="28" y="29" fill="#0ea5e9" fontSize="13" fontWeight="bold" textAnchor="middle" fontFamily="system-ui, sans-serif">
    T
  </text>

  <!-- Bottom Instruction Pill -->
  <rect x="14" y="130" width="172" height="22" rx="11" fill="#1e293b" stroke="#0ea5e9" stroke-opacity="0.2" stroke-width="1" />
  <text x="100" y="145" fill="#0ea5e9" fontSize="10.5" fontWeight="600" textAnchor="middle" fontFamily="system-ui, sans-serif">
    Letter T · ASL Sign
  </text>
</svg>
